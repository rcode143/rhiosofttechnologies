<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Menu</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
  --primary: #2563eb;
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --radius: 14px;
  --shadow: rgba(0,0,0,0.06);
}

/* Dark Mode */
body.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --shadow: rgba(0,0,0,0.4);
}

* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
  transition: background 0.3s, color 0.3s;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* Header */
header {
  background: var(--primary);
  color: #fff;
  padding: 24px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin-top: 6px;
  font-size: 14px;
  opacity: 0.9;
}

/* Theme Toggle */
.toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--card);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 16px var(--shadow);
  z-index: 100;
}

/* Container */
.container {
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

/* Menu */
.menu {
  display: grid;
  gap: 16px;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  box-shadow: 0 6px 16px var(--shadow);
}

.card:hover {
  transform: translateY(-4px);
}

.icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(37,99,235,0.15);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.card h3 {
  margin: 0;
  font-size: 16px;
}

.card p {
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
}

/* Footer */
footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding: 16px;
}
</style>
</head>

<body>

<!-- Dark Mode Toggle -->
<div class="toggle" onclick="toggleTheme()">
  <i class="fas fa-moon" id="themeIcon"></i>
</div>

<header>
  <h1>Quick Access Menu</h1>
  <p>Select an option to continue</p>
</header>

<div class="container">
  <div class="menu">

    <div style="display:none;" class="card" onclick="goTo('https://example.com/profile')">
      <div class="icon"><i class="fas fa-user"></i></div>
      <div>
        <h3>Profile</h3>
        <p>View personal information</p>
      </div>
    </div>

    <div class="card" onclick="goTo('https://example.com/services')">
      <div class="icon"><i class="fas fa-heartbeat"></i></div>
      <div>
        <h3>Farrowing</h3>
        <p>Sow Farrowing Records</p>
      </div>
    </div>

    <div  class="card" onclick="goTo('https://example.com/gallery')">
      <div class="icon"> <i class="fas fa-dna"></i></div>
      <div>
        <h3>Breeding</h3>
        <p>Sow Breeding Records</p>
      </div>
    </div>

    <div class="card" onclick="goTo('https://example.com/contact')">
      <div class="icon"><i class="fas fa-envelope"></i></div>
      <div>
        <h3>Contact Us</h3>
        <p>Get in touch</p>
      </div>
    </div>

  </div>
</div>

<footer>
  © 2026 • Powered by RhioSoft Technologies
</footer>

<script>
const themeIcon = document.getElementById('themeIcon');
const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme(theme) {
  document.body.classList.toggle('dark', theme === 'dark');
  themeIcon.className = theme === 'dark'
    ? 'fas fa-sun'
    : 'fas fa-moon';
}

function toggleTheme() {
  const isDark = document.body.classList.contains('dark');
  const newTheme = isDark ? 'light' : 'dark';
  localStorage.setItem('theme', newTheme);
  applyTheme(newTheme);
}

function goTo(url) {
  window.location.href = url;
}

/* Initial Load */
const savedTheme = localStorage.getItem('theme');

if (savedTheme) {
  applyTheme(savedTheme);
} else {
  applyTheme(systemTheme.matches ? 'dark' : 'light');
}

/* Listen to system theme change (no manual override) */
systemTheme.addEventListener('change', e => {
  if (!localStorage.getItem('theme')) {
    applyTheme(e.matches ? 'dark' : 'light');
  }
});
</script>

</body>
</html>
